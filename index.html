<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice of the People</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='3' width='26' height='26' fill='white' stroke='black' stroke-width='2'/><circle cx='12' cy='20' r='3.5' fill='%23ff7f0e' stroke='black'/><circle cx='20' cy='12' r='3.5' fill='black'/></svg>">
<style>
@font-face{font-family:"CMU Serif";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/cmu-serif-500-roman.woff2") format("woff2")}
@font-face{font-family:"CMU Serif";font-style:italic;font-weight:400;font-display:swap;src:url("fonts/cmu-serif-500-italic.woff2") format("woff2")}
@font-face{font-family:"CMU Serif";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/cmu-serif-700-roman.woff2") format("woff2")}
@font-face{font-family:"CMU Serif";font-style:italic;font-weight:700;font-display:swap;src:url("fonts/cmu-serif-700-italic.woff2") format("woff2")}
:root{
  --paper:#FFFFFF; --ink:#000000; --grey:#5E5E5E; --faint:#A8A8A8; --hair:#000000;
  --you:#FF7F0E; --link:#0000C8; --err:#B00000;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.45 "CMU Serif","Latin Modern Roman","Computer Modern",Cambria,Georgia,serif;font-kerning:normal;font-feature-settings:"kern","liga"}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:1px dotted var(--ink);outline-offset:3px}
.page{max-width:1020px;margin:0 auto;padding:56px 32px 96px}
@media (max-width:600px){.page{padding:32px 18px 72px}body{font-size:17px}}
.prose{max-width:640px}
.prose p,p.j{text-align:justify;hyphens:auto;-webkit-hyphens:auto}

/* title block */
.titleblock{text-align:center;margin:0 0 36px}
.titleblock h1{font-size:30px;line-height:1.2;font-weight:400;margin:0 0 14px}
.titleblock .sub{font-size:20px;display:block;margin-top:4px}
.titleblock .author{margin:0;font-size:18px}
.titleblock .date{margin:2px 0 0;font-size:18px}
.contents{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 28px;margin:22px 0 0;font-size:17px}
.contents a{text-decoration:none}
.contents a:hover{text-decoration:underline}
.contents a .no{margin-right:.5em}
.contents a[aria-current="page"]{font-weight:700}
.contents .acct{color:var(--grey);font-style:italic}
.contents .acct a{font-style:normal;color:var(--ink)}
.note{margin:0 0 28px;font-size:16px;max-width:640px;margin-left:auto;margin-right:auto;text-align:center;font-style:italic;color:var(--grey)}
.note.err{color:var(--err);font-style:normal}

/* sections */
h2{font-size:22px;font-weight:700;margin:0 0 12px;line-height:1.25}
h2 .no{display:inline-block;min-width:1.6em}
h3 .no{margin-right:.9em}
h3{font-size:18px;font-weight:700;margin:32px 0 8px}
p{margin:0 0 12px}
.lead{margin-bottom:18px}

/* controls */
.btn{font:inherit;font-size:16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 14px 6px;cursor:pointer;border-radius:0;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{background:#2a2a2a}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.ghost:hover{background:#F0F0F0}
.btn.sm{font-size:15px;padding:2px 10px 3px}
.btn.warn{border-color:transparent;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding-left:4px;padding-right:4px}
.btn.warn:hover{color:var(--err);background:none}
.btn:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:4px 2px;width:100%}
textarea{border:1px solid var(--ink);padding:8px 10px;min-height:110px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint);font-style:italic}
label.f{display:grid;gap:2px;font-style:italic}
.msg{min-height:1.4em;margin:10px 0 0;font-size:16px;font-style:italic}

/* chart line */
.chartline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 14px}
.chartline select{width:auto;max-width:100%;font-style:italic;cursor:pointer;padding-right:18px;appearance:none;-webkit-appearance:none;background:linear-gradient(45deg,transparent 50%,var(--ink) 50%) right 6px top 55%/5px 5px no-repeat,linear-gradient(-45deg,transparent 50%,var(--ink) 50%) right 1px top 55%/5px 5px no-repeat}
.subfigs{display:flex;flex-wrap:wrap;gap:4px 24px;margin:0 0 18px}
.subfigs button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:4px}
.subfigs button:hover{text-decoration-color:var(--ink)}
.subfigs button[aria-pressed="true"]{font-weight:700;text-decoration:none}
.subfigs button:disabled{color:var(--faint);text-decoration:none;cursor:default}
.lockbox{margin:22px 0 0;padding:14px 0 0;border-top:1px solid var(--ink)}
.lockbox p{text-align:justify;hyphens:auto;-webkit-hyphens:auto;font-size:16px}
.lockbox .row{display:flex;flex-wrap:wrap;gap:10px}
.pt.fixed{cursor:default}
.pt.fixed .dot{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}

/* layout: figure + table */
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:28px 48px;align-items:start}
@media (min-width:880px){.stage{grid-template-columns:minmax(0,580px) minmax(0,1fr)}}
@media (max-width:879px){.stage>.side{order:-1}}

/* figure */
.fig{display:grid;grid-template-columns:22px minmax(0,1fr) 46px;grid-template-rows:auto auto;column-gap:8px}
.ylab{grid-column:1;grid-row:1;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;font-size:15px;font-style:italic;white-space:nowrap;overflow:hidden}
.xlab{grid-column:2;grid-row:2;display:flex;justify-content:space-between;gap:12px;font-size:15px;font-style:italic;margin-top:4px}
.xlab span,.ylab span{overflow:hidden;text-overflow:ellipsis}
.plot{grid-column:2;grid-row:1;position:relative;aspect-ratio:1/1;border:1px solid var(--ink);background:var(--paper);touch-action:none}
.plot.over{outline:2px solid var(--you);outline-offset:-2px}
.plot>svg,.plot>canvas,.plot>.layer{position:absolute;inset:0;width:100%;height:100%}
.plot>canvas{image-rendering:auto}
.cbar{grid-column:3;grid-row:1;display:grid;grid-template-columns:12px auto;grid-template-rows:auto 1fr auto;column-gap:5px;font-size:13px;visibility:hidden}
.cbar.on{visibility:visible}
.cbar .grad{grid-row:1/4;border:1px solid var(--ink);background:linear-gradient(to top,#00007F 0%,#0000FF 12.5%,#00FFFF 37.5%,#7FFF7F 50%,#FFFF00 62.5%,#FF0000 87.5%,#7F0000 100%)}
.cbar .hi{grid-column:2;grid-row:1;line-height:1}
.cbar .lo{grid-column:2;grid-row:3;line-height:1}
.cbar .cap{grid-column:2;grid-row:2;writing-mode:vertical-rl;justify-self:start;align-self:center;font-style:italic}
.caption{margin:14px 0 0;font-size:16px;line-height:1.4;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.caption b{font-weight:400}
.status{font-style:italic;color:var(--grey);font-size:15px;margin:6px 0 0}
.toggle{display:flex;gap:8px;align-items:center;font-size:16px;margin:-6px 0 16px;cursor:pointer;width:max-content;max-width:100%}
.toggle input{width:auto;margin:0;accent-color:#000;cursor:pointer}

/* points */
.pt{position:absolute;display:flex;align-items:center;gap:6px;transform:translate(-9px,-50%);padding:3px;margin:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;z-index:2;white-space:nowrap;line-height:1}
.pt:hover,.pt:focus-visible{z-index:5}
.pt:focus-visible{outline:none}
.pt:focus-visible .nm{text-decoration:underline}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ink);border:1.5px solid var(--paper);box-shadow:0 0 0 1px var(--ink);flex:none}
.pt.mine .dot{background:var(--you);border:1px solid var(--ink);box-shadow:none}
.nm{text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff}
.nm i{font-style:normal;color:var(--grey);margin-left:3px}
.pt.static{cursor:pointer}
.pt.quiet{cursor:default}
.pt.quiet .nm{background:#fff;border:1px solid var(--ink);padding:2px 5px 3px;text-shadow:none}
.pt.quiet .dot{background:#fff;box-shadow:0 0 0 1.5px var(--ink);border:0}
.ring{position:absolute;width:13px;height:13px;border:2px solid var(--you);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;box-shadow:0 0 0 1px var(--ink),inset 0 0 0 1px var(--ink)}
.vdot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--ink);border:1px solid #fff;transform:translate(-50%,-50%);pointer-events:none}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:none}
.dragging,.dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.lifted{opacity:.3}

/* booktabs tables */
.tabcap{font-size:16px;margin:0 0 6px}
table.bk{border-collapse:collapse;width:100%;font-size:16px;margin:0 0 6px}
table.bk thead th{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:400;text-align:left;padding:5px 8px}
table.bk tbody tr:last-child td{border-bottom:2px solid var(--ink)}
table.bk tbody tr:first-child td{padding-top:7px}
table.bk td{padding:3px 8px;vertical-align:baseline}
table.bk .r{text-align:right;font-variant-numeric:tabular-nums}
table.bk .acts{text-align:right;white-space:nowrap}
table.bk .acts>*+*{margin-left:6px}
table.bk td small{display:block;font-style:italic;color:var(--grey);font-size:15px}
.cellbtn{font:inherit;border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;gap:8px}
.cellbtn .mk{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink);flex:none}
.cellbtn .mk.f{background:var(--ink)}
.cellbtn .mk.o{background:var(--you)}
tr.drag .cellbtn{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
tr.drag:hover td,tr.pick:hover td{background:#F2F2F2}
tr.sel td{background:#F2F2F2;font-weight:700}
tr.off td{color:var(--grey);font-style:italic}
tr.off .cellbtn{cursor:default}
td.none{font-style:italic;color:var(--grey)}
.tabnote{font-size:15px;color:var(--grey);font-style:italic;margin:4px 0 0;text-align:justify;hyphens:auto}

/* forms */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:40px 56px;align-items:start}
@media (min-width:880px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}
legend{padding:0;margin:0 0 6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
@media (max-width:460px){.pair{grid-template-columns:1fr}}
.preview .fig{max-width:420px}
.inline{display:flex;gap:12px;align-items:end;margin-top:12px}
.inline input{flex:1}
.narrow{max-width:420px;margin:0 auto}
.narrow form{display:grid;gap:12px}
.narrow .btn{width:100%}
.or{text-align:center;font-style:italic;color:var(--grey);margin:14px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="page">
  <header class="titleblock">
    <h1>Voice of the People<span class="sub">Towards the theory of PhD students’ character classification</span></h1>
    <p class="author">Anonymous et al.</p>
    <p class="date" id="date"></p>
    <nav class="contents" id="nav" aria-label="Contents"></nav>
  </header>
  <p id="notice" class="note" role="status" hidden></p>
  <main id="app"></main>
</div>
<script type="module">
"use strict";
const CFG = window.VP_CONFIG || {};
const LIVE = !!(CFG.firebase && CFG.firebase.apiKey && CFG.firebase.projectId);
const OWNER = (CFG.ownerEmail || "").trim().toLowerCase();
const $ = s => document.querySelector(s);

/* ================= stores ================= */
async function makeLiveStore() {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{ initializeApp }, Au, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = initializeApp(CFG.firebase);
  const auth = Au.getAuth(app), db = F.getFirestore(app);
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  const col = n => F.collection(db, n), ref = (n, id) => F.doc(db, n, id);
  return {
    live: true,
    onAuth: cb => Au.onAuthStateChanged(auth, u => cb(u && { uid: u.uid, anon: u.isAnonymous, email: (u.email || "").toLowerCase(), name: u.displayName || "" })),
    signInAnon: () => Au.signInAnonymously(auth),
    async signInGoogle() {
      const p = new Au.GoogleAuthProvider(), cur = auth.currentUser;
      if (!cur || !cur.isAnonymous) return Au.signInWithPopup(auth, p);
      // Upgrade this browser's anonymous identity so its votes carry over;
      // if the Google account already exists, switch to it instead.
      try { await Au.linkWithPopup(cur, p); await cur.reload(); A.user = { uid: cur.uid, anon: false, email: (cur.email || "").toLowerCase(), name: cur.displayName || "" }; onUser(A.user); }
      catch (e) {
        const cred = Au.GoogleAuthProvider.credentialFromError(e);
        if (e && /credential-already-in-use|email-already-in-use/.test(e.code || "") && cred) await Au.signInWithCredential(auth, cred);
        else throw e;
      }
    },
    async sendLink(email) {
      await Au.sendSignInLinkToEmail(auth, email, { url: location.origin + location.pathname, handleCodeInApp: true });
      try { localStorage.setItem("vp-email", email); } catch (_) {}
    },
    isLink: () => Au.isSignInWithEmailLink(auth, location.href),
    async completeLink(email) {
      await auth.authStateReady();
      const cur = auth.currentUser;
      if (cur && cur.isAnonymous) {
        try { await Au.linkWithCredential(cur, Au.EmailAuthProvider.credentialWithLink(email, location.href)); await cur.reload(); onUser({ uid: cur.uid, anon: false, email: (cur.email || "").toLowerCase(), name: cur.displayName || "" }); }
        catch (e) {
          if (/credential-already-in-use|email-already-in-use/.test((e && e.code) || "")) await Au.signInWithEmailLink(auth, email, location.href);
          else throw e;
        }
      } else await Au.signInWithEmailLink(auth, email, location.href);
      try { localStorage.removeItem("vp-email"); } catch (_) {}
      history.replaceState(null, "", location.pathname + location.hash);
    },
    signOut: () => Au.signOut(auth),
    async isAdmin(u) {
      if (u.anon || !u.email) return false;
      if (OWNER && u.email === OWNER) return true;
      try { return (await F.getDoc(ref("admins", u.email))).exists(); } catch (_) { return false; }
    },
    watchLiveCharts: (cb, err) => F.onSnapshot(F.query(col("charts"), F.where("status", "in", ["live", "closed"])), s => cb(rows(s)), err),
    watchMyCharts: (uid, cb, err) => F.onSnapshot(F.query(col("charts"), F.where("proposedBy", "==", uid)), s => cb(rows(s)), err),
    watchAllCharts: (cb, err) => F.onSnapshot(col("charts"), s => cb(rows(s)), err),
    watchStudents: (cb, err) => F.onSnapshot(col("students"), s => cb(rows(s)), err),
    watchLocks: (cb, err) => F.onSnapshot(col("locks"), s => cb(rows(s)), err),
    lockChart: (voteId, cid, p) => F.setDoc(ref("locks", voteId + "_" + cid), { v: voteId, c: cid, p }),
    // Later lock-ins on the same chart: one write-once document per student.
    async lockMore(voteId, cid, p) { const b = F.writeBatch(db); for (const sid in p) b.set(ref("locks", `${voteId}_${cid}_${sid}`), { v: voteId, c: cid, s: sid, p: { [sid]: p[sid] } }); await b.commit(); },
    async loadBallot(uid) {
      const b = await F.getDoc(ref("ballots", uid));
      if (!b.exists()) return null;
      const voteId = b.data().voteId, v = await F.getDoc(ref("votes", voteId));
      return { voteId, p: v.exists() ? (v.data().p || {}) : {} };
    },
    async saveVote(u, voteId, p, charts) {
      const b = F.writeBatch(db); let id = voteId;
      if (!id) { id = F.doc(col("votes")).id; b.set(ref("ballots", u.uid), { voteId: id }); }
      b.set(ref("votes", id), { p });
      await b.commit(); return id;
    },
    propose: (u, f, live) => F.addDoc(col("charts"), { ...f, status: live ? "live" : "proposed", proposedBy: u.uid, createdAt: F.serverTimestamp() }),
    setChartStatus: (id, status) => F.updateDoc(ref("charts", id), { status }),
    deleteChart: id => F.deleteDoc(ref("charts", id)),
    async addStudents(names) { const b = F.writeBatch(db), t = Date.now(); names.forEach((name, i) => b.set(F.doc(col("students")), { name, order: t + i })); await b.commit(); },
    removeStudent: id => F.deleteDoc(ref("students", id)),
    watchAdmins: (cb, err) => F.onSnapshot(col("admins"), s => cb(s.docs.map(d => d.id)), err),
    addAdmin: (email, by) => F.setDoc(ref("admins", email), { addedBy: by }),
    removeAdmin: email => F.deleteDoc(ref("admins", email)),
  };
}

function makeDemoStore() {
  const clamp1 = v => Math.max(-1, Math.min(1, Math.round(v * 1000) / 1000));
  const rn = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); };
  const D = {
    charts: [{ id: "demo1", a1l: "Axis 1 Left", a1r: "Axis 1 Right", a2l: "Axis 2 Left", a2r: "Axis 2 Right", status: "live", proposedBy: "x", createdAt: 1 }],
    students: [{ id: "s1", name: "Student 1", order: 1 }, { id: "s2", name: "Student 2", order: 2 }],
    votes: new Map(), locks: [], admins: [],
  };
  const centres = { s1: [-.45, .45], s2: [.4, -.35] };
  for (let i = 0; i < 9; i++) {
    const p = { demo1: {} };
    for (const s in centres) p.demo1[s] = [clamp1(centres[s][0] + rn() * .3), clamp1(centres[s][1] + rn() * .3)];
    D.locks.push({ id: "v" + i + "_demo1", v: "v" + i, c: "demo1", p: p.demo1 });
  }
  const subs = [];
  const sub = (get, cb) => { const s = { get, cb }; subs.push(s); setTimeout(() => cb(get()), 0); return () => { const i = subs.indexOf(s); if (i >= 0) subs.splice(i, 1); }; };
  const emit = () => subs.forEach(s => s.cb(s.get()));
  const clone = x => JSON.parse(JSON.stringify(x));
  let ballot = null;
  return {
    live: false,
    onAuth(cb) { setTimeout(() => cb({ uid: "me", anon: false, email: "you@example.ac.uk", name: "You" }), 0); return () => {}; },
    signOut: async () => {}, signInAnon: async () => {}, signInGoogle: async () => {}, sendLink: async () => {}, isLink: () => false,
    isAdmin: async () => true,
    watchLiveCharts: cb => sub(() => D.charts.filter(c => c.status === "live" || c.status === "closed").map(c => ({ ...c })), cb),
    watchMyCharts: (uid, cb) => sub(() => D.charts.filter(c => c.proposedBy === uid).map(c => ({ ...c })), cb),
    watchAllCharts: cb => sub(() => D.charts.map(c => ({ ...c })), cb),
    watchStudents: cb => sub(() => D.students.map(s => ({ ...s })), cb),
    watchLocks: cb => sub(() => D.locks.map(clone), cb),
    async lockChart(voteId, cid, p) { if (D.locks.some(l => l.v === voteId && l.c === cid)) throw { code: "permission-denied" }; D.locks.push({ id: voteId + "_" + cid, v: voteId, c: cid, p: clone(p) }); emit(); },
    async lockMore(voteId, cid, p) { for (const sid in p) { if (D.locks.some(l => l.v === voteId && l.c === cid && l.p[sid])) throw { code: "permission-denied" }; } for (const sid in p) D.locks.push({ id: `${voteId}_${cid}_${sid}`, v: voteId, c: cid, s: sid, p: { [sid]: clone(p[sid]) } }); emit(); },
    loadBallot: async () => ballot ? { voteId: ballot, p: clone(D.votes.get(ballot) || {}) } : null,
    async saveVote(u, voteId, p) { ballot = voteId || "mine"; D.votes.set(ballot, clone(p)); emit(); return ballot; },
    async propose(u, f, live) { D.charts.push({ id: "c" + Date.now(), ...f, status: live ? "live" : "proposed", proposedBy: u.uid, createdAt: Date.now() }); emit(); },
    async setChartStatus(id, status) { const c = D.charts.find(c => c.id === id); if (c) c.status = status; emit(); },
    async deleteChart(id) { D.charts = D.charts.filter(c => c.id !== id); emit(); },
    async addStudents(names) { const t = Date.now(); names.forEach((name, i) => D.students.push({ id: "s" + t + i, name, order: t + i })); emit(); },
    async removeStudent(id) { D.students = D.students.filter(s => s.id !== id); emit(); },
    watchAdmins: cb => sub(() => D.admins.slice(), cb),
    async addAdmin(e) { if (!D.admins.includes(e)) D.admins.push(e); emit(); },
    async removeAdmin(e) { D.admins = D.admins.filter(x => x !== e); emit(); },
  };
}

/* ================= state ================= */
let store = null;
const A = {
  authReady: false, user: null, admin: false, linkNeedsEmail: false, fatal: "", error: "", note: "",

const csvCell = v => { const t = String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
const csv = rows => rows.map(r => r.map(csvCell).join(",")).join("\n") + "\n";
const f4 = v => (Math.round(v * 10000) / 10000).toString();
function densityGrid(pts, N) {
  const k = 1 / (2 * BANDWIDTH * BANDWIDTH), g = new Float32Array(N * N); let max = 0;
  for (let j = 0; j < N; j++) { const y = 1 - 2 * j / (N - 1); for (let i = 0; i < N; i++) { const x = -1 + 2 * i / (N - 1); let s = 0; for (const p of pts) { const dx = x - p[0], dy = y - p[1]; s += Math.exp(-(dx * dx + dy * dy) * k); } g[j * N + i] = s; if (s > max) max = s; } }
  if (max) for (let q = 0; q < g.length; q++) g[q] /= max;
  return g;
}
async function figurePng(c, title, bg, fg) {
  try { await document.fonts.ready; } catch (_) {}
  const W = 1400, L = 150, T = 150, S = 1100, cv = document.createElement("canvas"); cv.width = W; cv.height = W;
  const x = cv.getContext("2d"), P = p => [L + (p[0] + 1) / 2 * S, T + (1 - p[1]) / 2 * S], serif = '"CMU Serif", Georgia, serif';
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, W);
  if (bg) bg(x, L, T, S);
  x.save(); x.setLineDash([10, 10]); x.strokeStyle = "rgba(0,0,0,.4)"; x.lineWidth = 1.5; x.beginPath();
  x.moveTo(L + S / 2, T); x.lineTo(L + S / 2, T + S); x.moveTo(L, T + S / 2); x.lineTo(L + S, T + S / 2); x.stroke(); x.restore();
  x.strokeStyle = "#000"; x.lineWidth = 2; x.strokeRect(L, T, S, S);
  fg(x, P, serif);
  x.fillStyle = "#000"; x.font = `italic 30px ${serif}`; x.textBaseline = "top";
  x.textAlign = "left"; x.fillText("← " + c.a1l, L, T + S + 18); x.textAlign = "right"; x.fillText(c.a1r + " →", L + S, T + S + 18);
  x.save(); x.translate(L - 18, T + S); x.rotate(-Math.PI / 2); x.textBaseline = "bottom";
  x.textAlign = "left"; x.fillText("← " + c.a2l, 0, 0); x.textAlign = "right"; x.fillText(c.a2r + " →", S, 0); x.restore();
  x.font = `40px ${serif}`; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillText(title, W / 2, T - 50);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  return new Uint8Array(await blob.arrayBuffer());
}
function haloText(x, t, px, py, font, align) {
  x.font = font; x.textAlign = align || "left"; x.textBaseline = "middle";
  x.lineJoin = "round"; x.strokeStyle = "#fff"; x.lineWidth = 7; x.strokeText(t, px, py); x.fillStyle = "#000"; x.fillText(t, px, py);
}
async function exportChart(c) {
  const enc = new TextEncoder(), files = [], dir = slug(`${c.a1l} ${c.a1r} vs ${c.a2l} ${c.a2r}`) + "/";
  const add = (name, data) => files.push({ name: dir + name, data: typeof data === "string" ? enc.encode(data) : data });
  const locks = A.locks.filter(l => l.c === c.id).sort((a, b) => a.id < b.id ? -1 : 1);
  const respondent = new Map(); for (const l of locks) if (!respondent.has(l.v)) respondent.set(l.v, respondent.size + 1);
  const known = new Map(A.students.map(s => [s.id, s.name]));
  const sids = []; for (const l of locks) for (const sid in l.p) if (validPt(l.p[sid]) && !sids.includes(sid)) sids.push(sid);
  sids.sort((a, b) => { const ia = A.students.findIndex(s => s.id === a), ib = A.students.findIndex(s => s.id === b); return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib); });
  const name = sid => known.get(sid) || `Removed student (${sid})`;
  const used = new Set(), fileName = sid => { let b = slug(name(sid)), n = b, i = 2; while (used.has(n)) n = `${b}-${i++}`; used.add(n); return n; };
  const points = [["student", "respondent", "x", "y"]], averages = [["student", "n", "mean_x", "mean_y", "sd_x", "sd_y"]], means = [];
  for (const sid of sids) {
    const pts = []; for (const l of locks) { const p = l.p[sid]; if (validPt(p)) { pts.push(p); points.push([name(sid), respondent.get(l.v), f4(p[0]), f4(p[1])]); } }
    const m = avg(pts), sd = k => Math.sqrt(pts.reduce((a, p) => a + (p[k] - m[k]) ** 2, 0) / (pts.length > 1 ? pts.length - 1 : 1));
    averages.push([name(sid), pts.length, f4(m[0]), f4(m[1]), pts.length > 1 ? f4(sd(0)) : "", pts.length > 1 ? f4(sd(1)) : ""]);
    means.push({ sid, pts, m });
  }
  add("points.csv", csv(points)); add("averages.csv", csv(averages));
  add("averages.png", await figurePng(c, `Crowd averages (${plural(respondent.size, "respondent", "respondents")})`, null, (x, P, serif) => {
    for (const { sid, pts, m } of means) { const [px, py] = P(m); x.beginPath(); x.arc(px, py, 10, 0, 7); x.fillStyle = "#000"; x.fill(); x.lineWidth = 3; x.strokeStyle = "#fff"; x.stroke(); haloText(x, `${name(sid)} (${pts.length})`, px + 18, py, `30px ${serif}`); }
  }));
  for (const { sid, pts, m } of means) {
    const fn = fileName(sid), G = 51, g = densityGrid(pts, G), rows = [["x", "y", "density"]];
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) rows.push([f4(-1 + 2 * i / (G - 1)), f4(1 - 2 * j / (G - 1)), f4(g[j * G + i])]);
    add(`density/${fn}.csv`, csv(rows));
    add(`heatmaps/${fn}.png`, await figurePng(c, `${name(sid)} (n = ${pts.length})`, (x, L, T, S) => {
      const hc = document.createElement("canvas"); drawHeat(hc, pts); x.imageSmoothingEnabled = true; x.drawImage(hc, L, T, S, S);
    }, (x, P, serif) => {
      for (const p of pts) { const [px, py] = P(p); x.beginPath(); x.arc(px, py, 6, 0, 7); x.fillStyle = "#000"; x.fill(); x.lineWidth = 2; x.strokeStyle = "#fff"; x.stroke(); }
      const [mx, my] = P(m); x.beginPath(); x.arc(mx, my, 11, 0, 7); x.fillStyle = "#fff"; x.fill(); x.lineWidth = 3; x.strokeStyle = "#000"; x.stroke();
      x.font = `30px ${serif}`; const t = "mean", w = x.measureText(t).width; x.fillStyle = "#fff"; x.fillRect(mx + 18, my - 22, w + 16, 44); x.lineWidth = 2; x.strokeRect(mx + 18, my - 22, w + 16, 44);
      x.fillStyle = "#000"; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(t, mx + 26, my + 1);
    }));
  }
  const when = new Date();
  add("README.txt", [
    "Voice of the People: results export",
    "",
    `Chart: ${c.a1l} – ${c.a1r} (horizontal) versus ${c.a2l} – ${c.a2r} (vertical)`,
    `Status: ${STATUS[c.status] || c.status}`,
    `Exported: ${when.toLocaleString("en-GB")}`,
    `Respondents (browsers that locked in placements): ${respondent.size}`,
    "",
    "Coordinates run from -1 to 1 on both axes:",
    `  x = -1 is "${c.a1l}", x = 1 is "${c.a1r}"`,
    `  y = -1 is "${c.a2l}", y = 1 is "${c.a2r}"`,
    "",
    "points.csv    every locked-in placement. 'respondent' is an anonymous number,",
    "              the same for one person across all students on this chart.",
    "averages.csv  number of votes, mean position and standard deviation per student.",
    "averages.png  the crowd-average figure.",
    "heatmaps/     one heatmap figure per student (jet colour scale; dots are votes).",
    "density/      the heatmap values on a 51 x 51 grid: a Gaussian kernel density",
    `              estimate with bandwidth ${BANDWIDTH}, scaled so the maximum is 1.`,
    "",
  ].join("\n"));
  const blob = makeZip(files), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `voice-of-the-people_${dir.slice(0, -1)}_${when.toISOString().slice(0, 10)}.zip`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

/* ---------- sign in ---------- */
BUILD.signin = () => {
  const msg = h("p", { class: "msg", "aria-live": "polite" });
  const email = h("input", { type: "email", required: true, autocomplete: "email", placeholder: "name@example.com", "aria-label": "Email address" });
  const google = h("button", { type: "button", class: "btn", text: "Continue with Google" });
  google.addEventListener("click", async () => { msg.textContent = ""; try { await store.signInGoogle(); } catch (e) { msg.textContent = "Google sign-in did not finish: " + errText(e) + "."; } });
  const form = h("form", null, email, h("button", { class: "btn ghost", type: "submit", text: "Email me a sign-in link" }));
  form.addEventListener("submit", async e => {
    e.preventDefault(); msg.textContent = "Sending…";
    try { await store.sendLink(email.value.trim().toLowerCase()); msg.textContent = "Link sent. Check your inbox and junk folder, and open it in this browser."; }
    catch (err) { msg.textContent = "Link not sent: " + errText(err) + "."; }
  });
  return { el: h("section", { class: "narrow" }, sectionHead("", "Administrator sign-in"),
    h("p", { class: "j", text: "Only administrators need an account; voting and proposing work without one. Sign in in the browser you vote in, so your placements stay with you." }),
    google, h("p", { class: "or", text: "or" }), form, msg) };
};
BUILD.confirmLink = () => {
  const msg = h("p", { class: "msg" });
  const email = h("input", { type: "email", required: true, autocomplete: "email", "aria-label": "Email address" });
  const form = h("form", null, email, h("button", { class: "btn", type: "submit", text: "Finish signing in" }));
  form.addEventListener("submit", async e => {
    e.preventDefault(); msg.textContent = "Signing in…";
    try { await store.completeLink(email.value.trim().toLowerCase()); A.linkNeedsEmail = false; render(); }
    catch (err) { msg.textContent = "Sign-in failed: " + errText(err) + ". Request a new link if this one has expired."; }
  });
  return { el: h("section", { class: "narrow" }, sectionHead("", "Confirm your email"), h("p", { class: "j", text: "This link was opened in a different browser from the one that requested it. Enter the address it was sent to." }), form, msg) };
};

/* ================= boot ================= */
window.addEventListener("hashchange", () => { A.error = ""; render(); });
(async function boot() {
  try { store = LIVE ? await makeLiveStore() : makeDemoStore(); }
  catch (e) { A.fatal = "Firebase did not load. Check your connection and the settings in config.js, then reload."; A.authReady = true; render(); return; }
  if (store.live && store.isLink()) {
    let em = null; try { em = localStorage.getItem("vp-email"); } catch (_) {}
    if (em) { try { await store.completeLink(em); } catch (e) { A.error = "That sign-in link has expired or was already used. Request a new one."; } }
    else A.linkNeedsEmail = true;
  }
  render();
  store.onAuth(onUser);
